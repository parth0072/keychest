# Example: 1Password backend (requires the `op` CLI, signed in).
# Each account maps to a field: op://Development/MyApp/<account>
backend: 1password
onepassword:
  vault: Development
  item: MyApp

environments: [Debug, Release]
environment_secrets: [apiKey]   # fields: apiKeyDebug, apiKeyRelease
global_secrets: [analyticsToken]
