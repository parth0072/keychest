name: Release

# Attaches a prebuilt universal macOS binary to a GitHub release, so installing Keychest does not
# need Xcode. It runs when a release is published, and can be run by hand to build the binary for
# a release that already exists (the tag may be older than this workflow).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to, for example v1.1.0"
        required: true

permissions:
  contents: write           # upload the assets to the release
  id-token: write           # sign the build provenance with this workflow's identity
  attestations: write       # store the provenance attestation
  artifact-metadata: write  # required by actions/attest

jobs:
  macos-binary:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # This checkout has the packaging script; the next one is the source that gets released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: source
      - name: Build, package and check
        run: Scripts/package-release.sh "$TAG" source
      # Signed build provenance: anyone can check that an archive was built by this workflow from
      # this repository with `gh attestation verify <file> -R parth0072/keychest`.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attach to the release
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber
