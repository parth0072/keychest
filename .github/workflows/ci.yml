name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Keychain integration tests (throwaway keychain)
        env:
          KEYCHEST_KEYCHAIN_TESTS: "1"
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 3600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain
          swift test --filter KeychainBackendIntegrationTests
      - name: End-to-end (generate, compile, round-trip)
        run: Scripts/e2e.sh

  kotlin:
    # Generates the Kotlin module and builds it with Gradle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: End-to-end (generate, Gradle build, round-trip)
        run: Scripts/e2e-kotlin.sh

  linux:
    # The core (config, obfuscation, code generation) is platform independent.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: End-to-end
        run: Scripts/e2e.sh
