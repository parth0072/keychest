name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Keychain integration tests (throwaway keychain)
        env:
          KEYCHEST_KEYCHAIN_TESTS: "1"
        run: |
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 3600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain
          security default-keychain -s ci.keychain
          swift test --filter KeychainBackendIntegrationTests
      - name: End-to-end (generate, compile, round-trip)
        run: Scripts/e2e.sh

  kotlin:
    # Generates the Kotlin module and builds it with Gradle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.8.2"
      - name: End-to-end (generate, Gradle build, round-trip)
        run: Scripts/e2e-kotlin.sh

  android:
    # Builds the Android sample with the Android Gradle plugin, against the generated Kotlin module.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - name: End-to-end (generate, build the Android sample, check the APKs)
        run: Scripts/e2e-android.sh

  linux:
    # The core (config, obfuscation, code generation) is platform independent.
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unit tests
        run: swift test
      - name: End-to-end
        run: Scripts/e2e.sh
